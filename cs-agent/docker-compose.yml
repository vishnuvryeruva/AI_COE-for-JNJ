services:
  cs-agent:
    build: .
    image: cs-agent:local
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      PORT: 8080
      BACKEND_PORT: 3000
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

volumes:
  pgdata:
